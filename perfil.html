<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil — HelpTI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body { padding-bottom: 70px !important; background-color: #17212B !important; color: #FFFFFF !important; font-family: sans-serif; margin: 0; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #17212B; border-top: 1px solid #263340; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
    .bottom-nav .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8695A7; font-size: 11px; position: relative; }
    .bottom-nav .nav-item.active { color: #4FD1C5; }
    .bottom-nav .nav-item i { font-size: 18px; margin-bottom: 4px; }
    
    .badge-notificacao { position: absolute; top: -4px; right: 22px; background-color: #FF4757; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #17212B; display: none; }

    .perfil-card { background: var(--surface, #1C2733); border: 1px solid var(--border, #263340); border-radius: 8px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
    .perfil-avatar { width: 80px; height: 80px; background: rgba(79, 209, 197, 0.1); border: 2px solid var(--accent, #4FD1C5); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #4FD1C5; margin: 0 auto 15px auto; }
    
    .info-group { background: var(--surface-alt, #263340); padding: 12px 15px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border, #263340); font-size: 0.95rem; }
    .info-label { color: #8695A7; font-weight: bold; }
    .info-value { color: #FFFFFF; }

    .btn-sair { background: #FF4757; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-sair:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="topbar" style="background: var(--surface, #1C2733); padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border, #263340);">
  <div class="logo" style="font-weight: bold; color: #4FD1C5; font-size: 1.5rem;"><span class="dot"></span> HelpTI Perfil</div>
  <div class="user-info">
    <span id="topbar-nome" style="font-weight: bold; color: #4FD1C5;">Carregando...</span>
  </div>
</div>

<div class="container" style="padding: 20px; max-width: 600px; margin: 20px auto 0;">
  
  <div class="perfil-card">
      <div class="perfil-avatar">
          <i class="fas fa-user"></i>
      </div>
      <h2 id="perfil-nome" style="margin: 0 0 5px 0; color: #FFFFFF;">Carregando...</h2>
      <p id="perfil-tipo" style="margin: 0; color: #8695A7; text-transform: capitalize; font-size: 0.9rem;">—</p>
  </div>

  <div style="background: var(--surface, #1C2733); border: 1px solid var(--border, #263340); border-radius: 8px; padding: 20px; margin-bottom: 20px;">
      <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1rem; color: #4FD1C5;"><i class="fas fa-id-card"></i> Detalhes da Conta</h3>
      
      <div class="info-group">
          <span class="info-label"><i class="fas fa-envelope"></i> E-mail</span>
          <span class="info-value" id="perfil-email">Carregando...</span>
      </div>

      <div class="info-group">
          <span class="info-label"><i class="fas fa-star" style="color: #FFD700;"></i> Reputação / Média</span>
          <span class="info-value" id="perfil-media" style="font-weight: bold; color: #FFD700;">Calculando...</span>
      </div>

      <div class="info-group" id="bloco-total-atendimentos" style="display: none;">
          <span class="info-label"><i class="fas fa-check-circle"></i> Atendimentos / Chamados</span>
          <span class="info-value" id="perfil-total-atendimentos">0</span>
      </div>
  </div>

  <button type="button" id="btn-logout" class="btn-sair">
      <i class="fas fa-sign-out-alt"></i> Sair da Conta
  </button>

</div>

<nav class="bottom-nav">
    <a href="feed.html" class="nav-item"><i class="fas fa-home"></i><span>Início</span></a>
    <a href="minhas-demandas.html" class="nav-item" id="nav-demandas" style="display:none;"><i class="fas fa-tools"></i><span>Atendimentos</span></a>
    <a href="chat.html" class="nav-item">
        <span class="badge-notificacao" id="badge-chat"></span>
        <i class="fas fa-comments"></i>
        <span>Chat</span>
    </a>
    <a href="perfil.html" class="nav-item active"><i class="fas fa-user"></i><span>Perfil</span></a>
</nav>

<script type="module">
    import { exigirLogin, fazerLogout } from "./js/auth.js";
    import { escutarDemandas } from "./js/demandas.js";

    let meuId = null;

    exigirLogin((user, perfil) => {
        meuId = user.uid;

        // Preenche dados básicos
        document.getElementById("topbar-nome").textContent = perfil.nome;
        document.getElementById("perfil-nome").textContent = perfil.nome;
        document.getElementById("perfil-email").textContent = user.email;
        document.getElementById("perfil-tipo").textContent = perfil.tipo === "tecnico" ? "Técnico Especialista" : "Cliente / Usuário";

        if (perfil.tipo === "tecnico") {
            const navDemandas = document.getElementById("nav-demandas");
            if(navDemandas) navDemandas.style.display = "flex";
        }

        // Escuta as demandas para calcular a reputação média (seja cliente ou técnico)
        escutarDemandas((chamados) => {
            let somaNotas = 0;
            let totalAvaliacoes = 0;
            let countAtendimentos = 0;

            if (perfil.tipo === "cliente") {
                // Para cliente: calcula média das avaliações que recebeu dos técnicos (campo avaliacaoCliente)
                chamados.forEach(c => {
                    if (c.clienteId === meuId) {
                        countAtendimentos++;
                        if (c.avaliacaoCliente) {
                            somaNotas += Number(c.avaliacaoCliente);
                            totalAvaliacoes++;
                        }
                    }
                });
            } else {
                // Para técnico: calcula média das avaliações que recebeu dos clientes (campo avaliacao)
                chamados.forEach(c => {
                    if (c.tecnicoId === meuId) {
                        countAtendimentos++;
                        if (c.avaliacao) {
                            somaNotas += Number(c.avaliacao);
                            totalAvaliacoes++;
                        }
                    }
                });
            }

            // Exibe total de chamados do usuário
            const blocoTotal = document.getElementById("bloco-total-atendimentos");
            if(blocoTotal) blocoTotal.style.display = "flex";
            document.getElementById("perfil-total-atendimentos").textContent = countAtendimentos;

            // Exibe a média de estrelas
            const spanMedia = document.getElementById("perfil-media");
            if (totalAvaliacoes > 0) {
                const media = (somaNotas / totalAvaliacoes).toFixed(1);
                spanMedia.innerHTML = `⭐ ${media} <span style="font-size: 0.8rem; color: #8695A7; font-weight: normal;">(${totalAvaliacoes} avaliações)</span>`;
            } else {
                spanMedia.innerHTML = `<span style="color: #8695A7; font-weight: normal;">Sem avaliações ainda (Novo)</span>`;
            }

            // Notificações no chat
            let temNotificacao = false;
            chamados.forEach(c => {
                if ((c.clienteId === meuId || c.tecnicoId === meuId) && c.status !== "aberto") {
                    if (c.ultimaMensagemDe && c.ultimaMensagemDe !== meuId && c.lida === false) {
                        temNotificacao = true;
                    }
                }
            });
            const badgeChat = document.getElementById("badge-chat");
            if(badgeChat) badgeChat.style.display = temNotificacao ? "block" : "none";
        });
    });

    document.getElementById("btn-logout").addEventListener("click", async () => {
        if (confirm("Deseja realmente sair da sua conta?")) {
            try {
                await fazerLogout();
                window.location.href = "index.html";
            } catch (err) {
                alert("Erro ao sair: " + err.message);
            }
        }
    });
</script>
</body>
</html>
