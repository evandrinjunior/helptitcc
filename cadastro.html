<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — HelpTI</title>
<link rel="stylesheet" href="css/style.css">
<style>
  select#tipo-conta { width: 100%; padding: 10px; border-radius: 6px; background: var(--surface-alt, #263340); border: 1px solid var(--border, #3a4a5e); color: #fff; font-size: 1rem; margin-top: 5px; cursor: pointer; }
  select#tipo-conta option { background: #17212B; color: #fff; }
</style>
</head>
<body>

<div class="auth-layout">
  <div class="auth-pitch">
    <div>
      <h1>Junte-se ao HelpTI.</h1>
      <p class="sub">Seja para encontrar soluções rápidas ou para oferecer o seu talento como técnico.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h2>Criar Conta</h2>
      <p class="sub">Preencha os dados abaixo para se cadastrar.</p>

      <form id="form-cadastro">
        <div class="campo" style="margin-bottom: 15px;">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" required placeholder="Digite seu nome">
        </div>
        
        <div class="campo" style="margin-bottom: 15px;">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email" placeholder="seu@email.com">
        </div>
        
        <div class="campo" style="margin-bottom: 15px;">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>

        <div class="campo" style="margin-bottom: 25px;">
          <label for="tipo-conta">Tipo de Conta</label>
          <select id="tipo-conta" required>
            <option value="cliente">Sou Cliente (Quero abrir chamados)</option>
            <option value="tecnico">Sou Técnico (Quero resolver chamados)</option>
          </select>
        </div>

        <div class="erro-msg" id="erro" style="color:var(--erro, #ff6b6b); font-size:0.85rem; margin-bottom:12px;"></div>
        
        <button type="submit" class="btn-primario" id="btn-cadastrar" style="width:100%;">Criar conta</button>
      </form>

      <p class="rodape-link">Já tem uma conta? <a href="login.html">Faça login</a></p>
    </div>
  </div>
</div>

<script type="module">
  import { cadastrarUsuario } from "./js/auth.js";

  document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-cadastrar");
    const erroDiv = document.getElementById("erro");
    
    if (erroDiv) erroDiv.textContent = "";
    btn.disabled = true;
    btn.textContent = "Criando conta...";

    try {
      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const tipo = document.getElementById("tipo-conta").value;

      await cadastrarUsuario(nome, email, senha, tipo);
      
    } catch (err) {
      if (erroDiv) erroDiv.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Criar conta";
    }
  });
</script>
</body>
</html>
