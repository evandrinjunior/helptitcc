<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — HelpTI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-layout">
  <div class="auth-pitch">
    <div>
      <h1>Quem entende resolve.<br>Quem precisa publica.</h1>
      <p class="sub">HelpTI conecta clientes com problemas de hardware ou software a técnicos disponíveis.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h2>Entrar</h2>
      <p class="sub">Acesse sua conta de cliente ou técnico.</p>

      <form id="form-login">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email" placeholder="seu@email.com">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="erro-msg" id="erro" style="color:var(--erro); font-size:0.85rem; margin-bottom:12px;"></div>
        <button type="submit" class="btn-primario" id="btn-entrar" style="width:100%;">Entrar</button>
      </form>

      <p class="rodape-link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>
</div>

<script type="module">
  // A importação está agora com o nome correto: logarUsuario
  import { logarUsuario } from "./js/auth.js";

  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-entrar");
    const erroDiv = document.getElementById("erro");
    
    if (erroDiv) erroDiv.textContent = "";
    btn.disabled = true;
    btn.textContent = "Entrando...";

    try {
      // Chamamos a função corretamente aqui
      await logarUsuario(
        document.getElementById("email").value.trim(),
        document.getElementById("senha").value
      );
    } catch (err) {
      if (erroDiv) erroDiv.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
