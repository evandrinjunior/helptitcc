<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — HelpTI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="auth-layout">
  <div class="auth-pitch">
    <div>
      <h1>Quem entende resolve.<br>Quem precisa publica.</h1>
      <p class="sub">HelpTI conecta clientes com problemas de hardware ou software a técnicos disponíveis.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h2>Entrar</h2>
      <p class="sub">Acesse sua conta de cliente ou técnico.</p>

      <form id="form-login">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email" placeholder="seu@email.com">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="erro-msg" id="erro" style="color:var(--erro, #FF4757); font-size:0.85rem; margin-bottom:12px;"></div>
        
        <button type="submit" class="btn-primario" id="btn-entrar" style="width:100%;">Entrar</button>
        
        <!-- Botão de esqueci a senha adicionado aqui -->
        <a href="#" id="btn-esqueci-senha" style="color: var(--accent, #4FD1C5); font-size: 0.85rem; text-decoration: none; display: block; text-align: center; margin-top: 15px;">Esqueci minha senha</a>
      </form>

      <!-- Botão do Google -->
      <div style="text-align: center; margin: 15px 0; color: #8695A7; font-size: 0.85rem;">OU</div>
      <button type="button" id="btn-google" style="width:100%; padding: 12px; border-radius: 6px; background: #fff; color: #17212B; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem;">
        <i class="fab fa-google" style="color: #DB4437; font-size: 1.2rem;"></i> Entrar com o Google
      </button>

      <p class="rodape-link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>
</div>

<script type="module">
  import { logarUsuario, loginComGoogle } from "./js/auth.js";
  import { auth } from "./js/firebase-config.js";
  import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // Login normal
  document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-entrar");
    const erroDiv = document.getElementById("erro");
    
    if (erroDiv) erroDiv.textContent = "";
    btn.disabled = true;
    btn.textContent = "Entrando...";

    try {
      await logarUsuario(
        document.getElementById("email").value.trim(),
        document.getElementById("senha").value
      );
    } catch (err) {
      if (erroDiv) erroDiv.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });

  // Login com Google
  document.getElementById("btn-google").addEventListener("click", async () => {
    const btnGoogle = document.getElementById("btn-google");
    btnGoogle.textContent = "Carregando...";
    try {
      await loginComGoogle();
    } catch (err) {
      alert("Erro no Google: " + err.message);
      btnGoogle.innerHTML = '<i class="fab fa-google" style="color: #DB4437; font-size: 1.2rem;"></i> Entrar com o Google';
    }
  });

  // Lógica de Recuperação de Senha
  document.getElementById("btn-esqueci-senha").addEventListener("click", async (e) => {
    e.preventDefault();
    const inputEmail = document.getElementById("email").value.trim(); 
    const erroDiv = document.getElementById("erro");
    
    if (!inputEmail) {
        if (erroDiv) erroDiv.textContent = "Por favor, digite seu e-mail no campo acima antes de clicar em 'Esqueci minha senha'.";
        return;
    }
    
    try {
        await sendPasswordResetEmail(auth, inputEmail);
        alert("E-mail de recuperação enviado! Verifique sua caixa de entrada e a pasta de spam.");
        if (erroDiv) erroDiv.textContent = "";
    } catch (error) {
        if (erroDiv) erroDiv.textContent = "Erro ao enviar o e-mail. Verifique se o endereço está correto e cadastrado no sistema.";
    }
  });
</script>
</body>
</html>
