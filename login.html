<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — HelpTI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body { background-color: #17212B; color: #FFFFFF; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .login-box { background: #1C2733; border: 1px solid #263340; border-radius: 10px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    .login-logo { text-align: center; font-size: 1.8rem; font-weight: bold; color: #4FD1C5; margin-bottom: 8px; }
    .login-sub { text-align: center; color: #8695A7; font-size: 0.9rem; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: #8695A7; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #263340; background: #263340; color: #FFFFFF; font-size: 0.95rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: #4FD1C5; }
    .esqueci-wrap { text-align: right; margin-top: -8px; margin-bottom: 15px; }
    .esqueci-wrap a { color: #4FD1C5; font-size: 0.82rem; text-decoration: none; }
    .esqueci-wrap a:hover { text-decoration: underline; }
    .btn-entrar { width: 100%; padding: 12px; background: #4FD1C5; color: #17212B; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 5px; }
    .btn-entrar:hover { opacity: 0.9; }
    .btn-entrar:disabled { opacity: 0.6; cursor: not-allowed; }
    .divisor { text-align: center; color: #8695A7; font-size: 0.8rem; margin: 18px 0; position: relative; }
    .btn-google { width: 100%; padding: 12px; background: #FFFFFF; color: #17212B; border: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
    .btn-google:hover { background: #E2E8F0; }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
    .erro-msg { background: rgba(255, 71, 87, 0.15); border: 1px solid #FF4757; color: #FF4757; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; display: none; text-align: center; }
    .sucesso-msg { background: rgba(79, 209, 197, 0.15); border: 1px solid #4FD1C5; color: #4FD1C5; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; display: none; text-align: center; }
    .links-rodape { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #8695A7; }
    .links-rodape a { color: #4FD1C5; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<div class="login-box">
    <div class="login-logo">HelpTI</div>
    <p class="login-sub">Acesse sua conta para gerenciar chamados</p>

    <div id="mensagem-erro" class="erro-msg"></div>
    <div id="mensagem-sucesso" class="sucesso-msg"></div>

    <form id="form-login">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="••••••••" required>
        </div>

        <div class="esqueci-wrap">
            <a href="#" id="btn-esqueci-senha">Esqueci minha senha</a>
        </div>

        <button type="submit" id="btn-submit" class="btn-entrar">Entrar</button>
    </form>

    <div class="divisor">ou continue com</div>

    <div class="form-group">
        <label for="tipo-google">Perfil (caso seja seu 1º acesso com Google)</label>
        <select id="tipo-google">
            <option value="cliente">Cliente (Preciso de suporte)</option>
            <option value="tecnico">Técnico (Presto suporte)</option>
        </select>
    </div>

    <button type="button" id="btn-google" class="btn-google">
        <i class="fab fa-google" style="color: #DB4437;"></i> Entrar com Google
    </button>

    <div class="links-rodape">
        Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
</div>

<script type="module">
    import { logarUsuario, loginComGoogle, recuperarSenha, redirecionarSeLogado } from "./js/auth.js";

    redirecionarSeLogado("feed.html");

    const erroDiv = document.getElementById("mensagem-erro");
    const sucessoDiv = document.getElementById("mensagem-sucesso");

    function limparMensagens() {
        erroDiv.style.display = "none";
        sucessoDiv.style.display = "none";
    }

    function mostrarErro(msg) {
        sucessoDiv.style.display = "none";
        erroDiv.textContent = msg;
        erroDiv.style.display = "block";
    }

    function mostrarSucesso(msg) {
        erroDiv.style.display = "none";
        sucessoDiv.textContent = msg;
        sucessoDiv.style.display = "block";
    }

    // Recuperar senha
    document.getElementById("btn-esqueci-senha").addEventListener("click", async (e) => {
        e.preventDefault();
        limparMensagens();

        const email = document.getElementById("email").value.trim();
        if (!email) {
            mostrarErro("Digite seu e-mail no campo acima para recuperar a senha.");
            document.getElementById("email").focus();
            return;
        }

        try {
            await recuperarSenha(email);
            mostrarSucesso("E-mail de redefinição enviado! Verifique sua caixa de entrada e spam.");
        } catch (err) {
            console.error("Erro ao recuperar senha:", err);
            if (err.code === "auth/user-not-found") {
                mostrarErro("Nenhuma conta encontrada com este e-mail.");
            } else if (err.code === "auth/invalid-email") {
                mostrarErro("Digite um endereço de e-mail válido.");
            } else {
                mostrarErro("Não foi possível enviar o e-mail de recuperação: " + (err.message || err.code));
            }
        }
    });

    // Login manual com e-mail e senha
    document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        limparMensagens();

        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;
        const btn = document.getElementById("btn-submit");

        btn.disabled = true;
        btn.textContent = "Entrando...";

        try {
            await logarUsuario(email, senha);
            window.location.href = "feed.html";
        } catch (err) {
            console.error("Erro no login:", err);
            mostrarErro("E-mail ou senha inválidos, ou erro de conexão.");
            btn.disabled = false;
            btn.textContent = "Entrar";
        }
    });

    // Login com Google
    document.getElementById("btn-google").addEventListener("click", async () => {
        limparMensagens();

        const btnGoogle = document.getElementById("btn-google");
        const tipoSelecionado = document.getElementById("tipo-google").value;

        btnGoogle.disabled = true;
        btnGoogle.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Conectando ao Google...`;

        try {
            await loginComGoogle(tipoSelecionado);
            window.location.href = "feed.html";
        } catch (err) {
            console.error("Erro no login Google:", err);
            if (err.code === "auth/unauthorized-domain") {
                mostrarErro("Domínio não autorizado no Firebase (adicione 127.0.0.1 ou localhost).");
            } else if (err.code === "auth/popup-closed-by-user") {
                mostrarErro("Janela fechada antes de concluir o login.");
            } else {
                mostrarErro("Não foi possível entrar com o Google: " + (err.message || err.code));
            }
            btnGoogle.disabled = false;
            btnGoogle.innerHTML = `<i class="fab fa-google" style="color: #DB4437;"></i> Entrar com Google`;
        }
    });
</script>
</body>
</html>
