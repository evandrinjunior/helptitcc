<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed — HelpTI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body { padding-bottom: 80px !important; background-color: #17212B !important; color: #FFFFFF !important; font-family: sans-serif; margin: 0; }
    .topbar { background: #1C2733; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #263340; position: sticky; top: 0; z-index: 900; }
    .topbar .logo { font-weight: bold; color: #4FD1C5; font-size: 1.4rem; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #17212B; border-top: 1px solid #263340; display: flex; justify-content: space-around; padding: 10px 0; z-index: 9999; }
    .bottom-nav .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8695A7; font-size: 11px; position: relative; cursor: pointer; }
    .bottom-nav .nav-item.active { color: #4FD1C5; }
    .bottom-nav .nav-item i { font-size: 18px; margin-bottom: 4px; }
    
    .badge-notificacao { position: absolute; top: -4px; right: 22px; background-color: #FF4757; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #17212B; display: none; }
    
    .chamado-card { background: #1C2733; border: 1px solid #263340; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .ticket-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    .status-aberto { background: rgba(79, 209, 197, 0.2); color: #4FD1C5; }
    .status-em_andamento, .status-em_negociacao { background: rgba(246, 173, 85, 0.2); color: #F6AD55; }
    .status-resolvido { background: rgba(104, 211, 145, 0.2); color: #68D391; }
    
    .btn-acao { padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-chat { background: #4FD1C5; color: #17212B; }
    .btn-assumir { background: #F6AD55; color: #17212B; }
    .btn-acao:hover { opacity: 0.9; }

    .filtros-container { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .btn-filtro { padding: 6px 14px; border-radius: 20px; border: 1px solid #263340; background: #1C2733; color: #8695A7; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: 0.2s; white-space: nowrap; }
    .btn-filtro.active { background: #4FD1C5; color: #17212B; border-color: #4FD1C5; }
</style>
</head>
<body>

<div class="topbar">
  <a href="feed.html" class="logo"><span class="dot"></span> HelpTI</a>
  <div class="user-info" style="display: flex; align-items: center; gap: 6px;">
    <span id="nome-usuario" style="font-weight: bold; color: #4FD1C5;">Carregando...</span>
    <span id="badge-tipo" style="font-size: 0.8rem; background: #263340; color: #FFFFFF; padding: 2px 8px; border-radius: 4px; border: 1px solid #324252; text-transform: capitalize;">—</span>
  </div>
</div>

<div class="feed-container" style="padding: 20px; max-width: 800px; margin: 10px auto 0;">
  
  <div id="painel-criar-chamado" style="display: none; background: #263340; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #324252;">
    <h3 style="margin-top:0; color: #FFFFFF;">Abrir novo chamado</h3>
    <form id="form-chamado" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
       <input type="text" id="titulo" placeholder="Resumo do problema (Ex: PC não liga)" required style="padding: 12px; border-radius: 6px; border: 1px solid #324252; background: #1C2733; color: white;">
       <textarea id="descricao" placeholder="Descreva os detalhes..." required rows="3" style="padding: 12px; border-radius: 6px; border: 1px solid #324252; background: #1C2733; color: white; resize: vertical;"></textarea>
       
       <div style="display: flex; gap: 10px; flex-wrap: wrap;">
           <select id="categoria" required style="flex: 1; min-width: 180px; padding: 12px; border-radius: 6px; border: 1px solid #324252; background: #1C2733; color: white;">
             <option value="hardware">Equipamento (Hardware)</option>
             <option value="software">Sistema/Programas (Software)</option>
           </select>

           <select id="modalidade" required style="flex: 1; min-width: 180px; padding: 12px; border-radius: 6px; border: 1px solid #324252; background: #1C2733; color: white;">
             <option value="remoto">Atendimento Remoto (Online)</option>
             <option value="presencial">Atendimento Presencial</option>
           </select>
       </div>

       <div id="bloco-geo-chamado" style="display: none; background: #1C2733; padding: 12px; border-radius: 6px; border: 1px solid #324252; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
           <div style="font-size: 0.85rem; color: #8695A7;">
               <i class="fas fa-map-marker-alt" style="color: #4FD1C5;"></i> <span id="texto-geo-chamado">Localização não anexada (o endereço exato só é combinado no chat).</span>
           </div>
           <button type="button" id="btn-capturar-geo-chamado" style="padding: 8px 12px; background: #263340; color: #4FD1C5; border: 1px solid #4FD1C5; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold;">
               <i class="fas fa-crosshairs"></i> Anexar minha localização
           </button>
       </div>

       <button type="submit" class="btn-primario" style="padding: 12px; background: #4FD1C5; color: #17212B; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1rem;">Publicar chamado</button>
    </form>
  </div>

  <h2 id="titulo-feed" style="color: #FFFFFF;">Mural de Chamados Abertos</h2>
  
  <div class="filtros-container" id="filtros-container">
      <button class="btn-filtro active" data-cat="todos">Todos</button>
      <button class="btn-filtro" data-cat="hardware"><i class="fas fa-desktop"></i> Hardware</button>
      <button class="btn-filtro" data-cat="software"><i class="fas fa-code"></i> Software</button>
      <button class="btn-filtro" data-cat="presencial"><i class="fas fa-map-marker-alt"></i> Presencial</button>
      <button class="btn-filtro" data-cat="remoto"><i class="fas fa-laptop"></i> Remoto</button>
  </div>

  <div id="lista-chamados">
    <p style="color: #8695A7;">Carregando chamados...</p>
  </div>
</div>

<!-- MODAL DO CALENDÁRIO PARA ESCOLHER PRAZO -->
<div id="modal-prazo" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; justify-content: center; align-items: center;">
    <div style="background: #1C2733; padding: 25px; border-radius: 8px; border: 1px solid #263340; width: 320px; color: white; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
        <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1rem; color: #4FD1C5;"><i class="fas fa-calendar-alt"></i> Previsão de Entrega</h3>
        <label style="font-size: 0.85rem; color: #8695A7; display: block; margin-bottom: 8px;">Selecione a data limite para este atendimento:</label>
        <input type="date" id="input-data-prazo" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #263340; background: #263340; color: white; margin-bottom: 20px; box-sizing: border-box; font-size: 1rem;">
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" id="btn-cancelar-prazo" style="padding: 8px 14px; background: #263340; border: 1px solid #324252; border-radius: 6px; cursor: pointer; color: #8695A7; font-weight: bold;">Cancelar</button>
            <button type="button" id="btn-salvar-prazo" style="padding: 8px 14px; background: #4FD1C5; border: none; border-radius: 6px; cursor: pointer; color: #17212B; font-weight: bold;">Confirmar</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="feed.html" class="nav-item active"><i class="fas fa-home"></i><span>Início</span></a>
    <a href="minhas-demandas.html" class="nav-item" id="nav-demandas" style="display:none;"><i class="fas fa-tools"></i><span>Atendimentos</span></a>
    <a href="chat.html" class="nav-item">
        <span class="badge-notificacao" id="badge-chat"></span>
        <i class="fas fa-comments"></i>
        <span>Chat</span>
    </a>
    <a href="perfil.html" class="nav-item"><i class="fas fa-user"></i><span>Perfil</span></a>
</nav>

<script type="module">
    import { exigirLogin } from "./js/auth.js";
    import { escutarDemandas, criarDemanda, assumirDemanda, atualizarDemanda, excluirDemanda, calcularDistanciaKm, obterCidadePorCoordenadas, LABEL_STATUS, LABEL_CATEGORIA, LABEL_MODALIDADE } from "./js/demandas.js";

    let meuPerfil = null;
    let meuId = null;
    let todosChamados = []; 
    let filtroAtual = "todos"; 
    let editandoId = null; 
    let demandaParaAssumirId = null;
    let coordChamado = null;

    exigirLogin((user, perfil) => {
        meuPerfil = perfil;
        meuId = user.uid;

        document.getElementById("nome-usuario").textContent = perfil.nome;
        document.getElementById("badge-tipo").textContent = perfil.tipo;

        if (perfil.tipo === "cliente") {
            document.getElementById("painel-criar-chamado").style.display = "block";
            document.getElementById("titulo-feed").textContent = "Meus Chamados";
        } else if (perfil.tipo === "tecnico") {
            document.getElementById("nav-demandas").style.display = "flex";
            document.getElementById("titulo-feed").textContent = "Mural de Chamados Abertos";
        }

        document.querySelectorAll(".btn-filtro").forEach(btn => {
            btn.addEventListener("click", (e) => {
                document.querySelectorAll(".btn-filtro").forEach(b => b.classList.remove("active"));
                e.currentTarget.classList.add("active");
                filtroAtual = e.currentTarget.getAttribute("data-cat");
                renderizarChamados();
            });
        });

        escutarDemandas((chamados) => {
            todosChamados = chamados;
            renderizarChamados();
            
            let temNotificacao = false;
            chamados.forEach(c => {
                if ((c.clienteId === meuId || c.tecnicoId === meuId) && c.status !== "aberto") {
                    if (c.ultimaMensagemDe && c.ultimaMensagemDe !== meuId && c.lida === false) {
                        temNotificacao = true;
                    }
                }
            });
            document.getElementById("badge-chat").style.display = temNotificacao ? "block" : "none";
        });
    });

    const selectModalidade = document.getElementById("modalidade");
    if (selectModalidade) {
        selectModalidade.addEventListener("change", (e) => {
            const blocoGeo = document.getElementById("bloco-geo-chamado");
            if (e.target.value === "presencial") {
                blocoGeo.style.display = "flex";
                if (meuPerfil && meuPerfil.latitude && meuPerfil.longitude && !coordChamado) {
                    coordChamado = {
                        latitude: meuPerfil.latitude,
                        longitude: meuPerfil.longitude,
                        cidade: meuPerfil.cidade || null
                    };
                    const nomeCidade = meuPerfil.cidade ? ` (${meuPerfil.cidade})` : "";
                    document.getElementById("texto-geo-chamado").textContent = `Localização do seu perfil anexada${nomeCidade}.`;
                    document.getElementById("texto-geo-chamado").style.color = "#68D391";
                }
            } else {
                blocoGeo.style.display = "none";
            }
        });
    }

    const btnGeoChamado = document.getElementById("btn-capturar-geo-chamado");
    if (btnGeoChamado) {
        btnGeoChamado.addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("Geolocalização não suportada neste navegador.");
                return;
            }
            btnGeoChamado.disabled = true;
            btnGeoChamado.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Buscando...`;

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const cidadeNome = await obterCidadePorCoordenadas(lat, lon);
                    coordChamado = { latitude: lat, longitude: lon, cidade: cidadeNome };

                    document.getElementById("texto-geo-chamado").textContent = cidadeNome
                        ? `Localização anexada: ${cidadeNome}`
                        : "Localização capturada com sucesso!";
                    document.getElementById("texto-geo-chamado").style.color = "#68D391";
                    btnGeoChamado.disabled = false;
                    btnGeoChamado.innerHTML = `<i class="fas fa-check"></i> Localização Anexada`;
                },
                (err) => {
                    alert("Não foi possível obter sua localização: " + err.message);
                    btnGeoChamado.disabled = false;
                    btnGeoChamado.innerHTML = `<i class="fas fa-crosshairs"></i> Anexar minha localização`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });
    }

    function renderizarChamados() {
        const listaDiv = document.getElementById("lista-chamados");
        listaDiv.innerHTML = "";
        let chamadosFiltrados = [];

        if (meuPerfil.tipo === "cliente") {
            chamadosFiltrados = todosChamados.filter(c => c.clienteId === meuId);
        } else {
            chamadosFiltrados = todosChamados.filter(c => c.status === "aberto" || c.tecnicoId === meuId);
        }

        if (filtroAtual === "hardware" || filtroAtual === "software") {
            chamadosFiltrados = chamadosFiltrados.filter(c => c.categoria === filtroAtual);
        } else if (filtroAtual === "presencial" || filtroAtual === "remoto") {
            chamadosFiltrados = chamadosFiltrados.filter(c => (c.modalidade || "remoto") === filtroAtual);
        }

        if (chamadosFiltrados.length === 0) {
            listaDiv.innerHTML = "<p style='color: #8695A7; text-align: center; padding: 20px;'>Nenhum chamado para mostrar no momento.</p>";
            return;
        }

        const ordemStatus = { "aberto": 1, "em_andamento": 2, "em_negociacao": 2, "resolvido": 3 };
        
        chamadosFiltrados.sort((a, b) => {
            const pesoA = ordemStatus[a.status] || 4;
            const pesoB = ordemStatus[b.status] || 4;
            if (pesoA === pesoB) {
                return (b.ticketId || 0) - (a.ticketId || 0); 
            }
            return pesoA - pesoB;
        });

        chamadosFiltrados.forEach(chamado => {
            const div = document.createElement("div");
            div.className = "chamado-card";
            
            let infoTecnico = "";
            if (chamado.tecnicoNome) {
                const avaliacoes = todosChamados.filter(c => c.tecnicoId === chamado.tecnicoId && c.avaliacao);
                let mediaTxt = "Novo";
                if (avaliacoes.length > 0) {
                    const soma = avaliacoes.reduce((acc, curr) => acc + curr.avaliacao, 0);
                    mediaTxt = (soma / avaliacoes.length).toFixed(1);
                }
                infoTecnico = ` • Técnico: ${chamado.tecnicoNome} <span style="color:#FFD700;">(⭐ ${mediaTxt})</span>`;
            }

            let badgeLocal = "";
            const modalidadeAtual = chamado.modalidade || "remoto";
            if (modalidadeAtual === "presencial") {
                const cidadeTexto = chamado.cidade ? chamado.cidade : "";
                if (meuPerfil.tipo === "tecnico" && meuPerfil.latitude && meuPerfil.longitude && chamado.latitude && chamado.longitude) {
                    const km = calcularDistanciaKm(meuPerfil.latitude, meuPerfil.longitude, chamado.latitude, chamado.longitude);
                    if (km !== null) {
                        const prefixo = cidadeTexto ? `${cidadeTexto} • ` : "";
                        badgeLocal = `<span style="font-size: 0.78rem; background: rgba(79, 209, 197, 0.15); color: #4FD1C5; padding: 3px 8px; border-radius: 4px; margin-left: 8px;"><i class="fas fa-map-marker-alt"></i> ${prefixo}Aprox. ${km} km</span>`;
                    }
                } else if (cidadeTexto) {
                    badgeLocal = `<span style="font-size: 0.78rem; background: rgba(79, 209, 197, 0.15); color: #4FD1C5; padding: 3px 8px; border-radius: 4px; margin-left: 8px;"><i class="fas fa-map-marker-alt"></i> ${cidadeTexto}</span>`;
                } else if (chamado.latitude && chamado.longitude) {
                    badgeLocal = `<span style="font-size: 0.78rem; background: rgba(79, 209, 197, 0.15); color: #4FD1C5; padding: 3px 8px; border-radius: 4px; margin-left: 8px;"><i class="fas fa-map-marker-alt"></i> Localização anexada</span>`;
                }
            }

            let infoPrazo = chamado.prazoEstimado 
                ? `<div style="font-size: 0.85rem; color: #F6AD55; margin-top: 8px; margin-bottom: 8px;"><i class="fas fa-calendar-check"></i> Previsão de Entrega: <strong>${chamado.prazoEstimado}</strong></div>` 
                : "";

            let tagEditado = chamado.editado 
                ? `<span style="font-size: 0.7rem; background: rgba(255, 255, 255, 0.1); color: #8695A7; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: normal; border: 1px solid #263340;">(Editado)</span>` 
                : "";

            let botoesAcao = `<a href="chat.html?id=${chamado.id}" class="btn-acao btn-chat"><i class="fas fa-comments"></i> Abrir Chat</a>`;

            if (meuPerfil.tipo === "tecnico" && chamado.status === "aberto") {
                botoesAcao = `<button class="btn-acao btn-assumir" data-id="${chamado.id}"><i class="fas fa-handshake"></i> Assumir Chamado</button> ` + botoesAcao;
            } else if (meuPerfil.tipo === "cliente" && chamado.status === "aberto") {
                botoesAcao = `
                    <button class="btn-acao btn-editar" data-id="${chamado.id}" style="background: #E2E8F0; color: #17212B;"><i class="fas fa-edit"></i> Editar</button>
                    <button class="btn-acao btn-excluir" data-id="${chamado.id}" style="background: #FF4757; color: white;"><i class="fas fa-trash"></i> Excluir</button>
                ` + botoesAcao;
            }

            div.innerHTML = `
                <div class="ticket-header">
                    <span style="font-weight: bold; color: #8695A7; font-size: 0.9rem;">#${chamado.ticketId}${infoTecnico}</span>
                    <span class="badge status-${chamado.status}">${LABEL_STATUS[chamado.status] || chamado.status}</span>
                </div>
                <h3 style="margin: 5px 0 10px 0; color: white; display: flex; align-items: center; flex-wrap: wrap;">${chamado.titulo} ${tagEditado} ${badgeLocal}</h3>
                <p style="color: #A0AAB5; font-size: 0.9rem; margin-bottom: 10px;">${chamado.descricao}</p>
                ${infoPrazo}
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #263340; padding-top: 15px; flex-wrap: wrap; gap: 10px;">
                    <span style="font-size: 0.85rem; color: #8695A7;">
                        <i class="fas fa-tag"></i> ${LABEL_CATEGORIA[chamado.categoria] || chamado.categoria} • 
                        <i class="fas fa-${modalidadeAtual === 'presencial' ? 'map-marker-alt' : 'laptop'}"></i> ${LABEL_MODALIDADE[modalidadeAtual] || modalidadeAtual}
                    </span>
                    <div style="display: flex; gap: 8px;">${botoesAcao}</div>
                </div>
            `;
            listaDiv.appendChild(div);
        });

        document.querySelectorAll(".btn-assumir").forEach(btn => {
            btn.addEventListener("click", (e) => {
                demandaParaAssumirId = e.currentTarget.getAttribute("data-id");
                const hoje = new Date().toISOString().split('T')[0];
                const inputData = document.getElementById("input-data-prazo");
                inputData.min = hoje;
                inputData.value = hoje;
                document.getElementById("modal-prazo").style.display = "flex";
            });
        });

        document.querySelectorAll(".btn-excluir").forEach(btn => {
            btn.addEventListener("click", async (e) => {
                const idDemanda = e.currentTarget.getAttribute("data-id");
                if (confirm("Tem certeza que deseja excluir este chamado?")) {
                    try {
                        await excluirDemanda(idDemanda);
                    } catch (err) {
                        alert("Erro ao excluir: " + err.message);
                    }
                }
            });
        });

        document.querySelectorAll(".btn-editar").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const idDemanda = e.currentTarget.getAttribute("data-id");
                const chamadoData = todosChamados.find(c => c.id === idDemanda);
                if (!chamadoData) return;
                
                document.getElementById("titulo").value = chamadoData.titulo;
                document.getElementById("descricao").value = chamadoData.descricao;
                document.getElementById("categoria").value = chamadoData.categoria;
                document.getElementById("modalidade").value = chamadoData.modalidade || "remoto";
                
                if ((chamadoData.modalidade || "remoto") === "presencial") {
                    document.getElementById("bloco-geo-chamado").style.display = "flex";
                } else {
                    document.getElementById("bloco-geo-chamado").style.display = "none";
                }

                editandoId = idDemanda;
                
                const btnSubmit = document.querySelector("#form-chamado button[type='submit']");
                if (btnSubmit) {
                    btnSubmit.textContent = "Salvar Alterações";
                    btnSubmit.style.background = "#F6AD55"; 
                    btnSubmit.style.color = "#17212B";
                }
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    }

    document.getElementById("btn-cancelar-prazo").addEventListener("click", () => {
        document.getElementById("modal-prazo").style.display = "none";
        demandaParaAssumirId = null;
    });

    document.getElementById("btn-salvar-prazo").addEventListener("click", async () => {
        const dataValor = document.getElementById("input-data-prazo").value;
        if (!dataValor) {
            alert("Por favor, selecione uma data válida.");
            return;
        }

        const partes = dataValor.split("-");
        const dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;

        try {
            await assumirDemanda(demandaParaAssumirId, meuId, meuPerfil.nome, dataFormatada);
            document.getElementById("modal-prazo").style.display = "none";
            demandaParaAssumirId = null;
            alert("Chamado assumido com sucesso! Status alterado para Em Andamento.");
        } catch (err) {
            alert("Erro ao assumir chamado: " + err.message);
        }
    });

    const formChamado = document.getElementById("form-chamado");
    if(formChamado) {
        formChamado.addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button[type='submit']");
            btn.textContent = "Processando...";
            btn.disabled = true;

            const modalidadeVal = document.getElementById("modalidade").value;
            const dados = {
                titulo: document.getElementById("titulo").value,
                descricao: document.getElementById("descricao").value,
                categoria: document.getElementById("categoria").value,
                modalidade: modalidadeVal
            };

            if (modalidadeVal === "presencial" && coordChamado) {
                dados.latitude = coordChamado.latitude;
                dados.longitude = coordChamado.longitude;
                if (coordChamado.cidade) dados.cidade = coordChamado.cidade;
            }

            try {
                if (editandoId) {
                    dados.editado = true;
                    await atualizarDemanda(editandoId, dados);
                    editandoId = null;
                    alert("Chamado atualizado com sucesso!");
                } else {
                    dados.clienteId = meuId;
                    dados.clienteNome = meuPerfil.nome;
                    await criarDemanda(dados);
                }
                e.target.reset();
                coordChamado = null;
                document.getElementById("bloco-geo-chamado").style.display = "none";
                document.getElementById("texto-geo-chamado").textContent = "Localização não anexada (o endereço exato só é combinado no chat).";
                document.getElementById("texto-geo-chamado").style.color = "#8695A7";
            } catch (error) {
                alert("Erro ao salvar: " + error.message);
            } finally {
                btn.textContent = "Publicar chamado";
                btn.style.background = "#4FD1C5";
                btn.style.color = "#17212B";
                btn.disabled = false;
                editandoId = null;
            }
        });
    }
</script>
</body>
</html>
