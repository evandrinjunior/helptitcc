<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed — HelpTI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    body { padding-bottom: 70px !important; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #17212B; border-top: 1px solid #263340; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
    .bottom-nav .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #8695A7; font-size: 11px; }
    .bottom-nav .nav-item.active { color: #4FD1C5; }
    .bottom-nav .nav-item i { font-size: 18px; margin-bottom: 4px; }
    
    /* Visual dos chamados no Feed */
    .chamado-card { background: var(--surface, #1C2733); border: 1px solid var(--border, #263340); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .ticket-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    .status-aberto { background: rgba(79, 209, 197, 0.2); color: #4FD1C5; }
    .status-em_negociacao { background: rgba(246, 173, 85, 0.2); color: #F6AD55; }
    .status-resolvido { background: rgba(104, 211, 145, 0.2); color: #68D391; }
    
    /* Estilo do botão de Chat */
    .btn-chat { background: var(--accent, #4FD1C5); color: #17212B; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; transition: 0.2s; }
    .btn-chat:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="dot"></span> HelpTI</div>
  <div class="user-info">
    <span id="nome-usuario" style="font-weight: bold; color: var(--accent);">Carregando...</span>
    <span class="badge-tipo" id="badge-tipo" style="margin-left: 6px; font-size: 0.8rem; background: var(--surface-alt); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); text-transform: capitalize;">—</span>
  </div>
</div>

<div class="feed-container" style="padding: 20px; max-width: 800px; margin: 60px auto 0;">
  
  <!-- Painel de Criar Chamado (Aparece SÓ para Clientes) -->
  <div id="painel-criar-chamado" style="display: none; background: var(--surface-alt, #263340); padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--border);">
    <h3 style="margin-top:0;">Abrir novo chamado</h3>
    <form id="form-chamado" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
       <input type="text" id="titulo" placeholder="Resumo do problema (Ex: PC não liga)" required style="padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: white;">
       <textarea id="descricao" placeholder="Descreva os detalhes..." required rows="3" style="padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: white; resize: vertical;"></textarea>
       <select id="categoria" required style="padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: white;">
         <option value="hardware">Equipamento (Hardware)</option>
         <option value="software">Sistema/Programas (Software)</option>
       </select>
       <button type="submit" class="btn-primario" style="padding: 12px; background: var(--accent); color: #17212B; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1rem;">Publicar chamado</button>
    </form>
  </div>

  <h2>Mural de Chamados</h2>
  <div id="lista-chamados" style="margin-top: 15px;">
    <p style="color: #8695A7;">Carregando chamados...</p>
  </div>

</div>

<nav class="bottom-nav">
    <a href="feed.html" class="nav-item active"><i class="fas fa-home"></i><span>Início</span></a>
    <a href="chat.html" class="nav-item"><i class="fas fa-comments"></i><span>Chat</span></a>
    <a href="perfil.html" class="nav-item"><i class="fas fa-user"></i><span>Perfil</span></a>
</nav>

<script type="module">
    import { exigirLogin } from "./js/auth.js";
    import { escutarDemandas, criarDemanda, LABEL_STATUS, LABEL_CATEGORIA } from "./js/demandas.js";

    let meuPerfil = null;
    let meuId = null;

    exigirLogin((user, perfil) => {
        meuPerfil = perfil;
        meuId = user.uid;

        // Se for cliente, exibe a caixa de abrir chamado. Técnicos não veem isso.
        if (perfil.tipo === "cliente") {
            document.getElementById("painel-criar-chamado").style.display = "block";
        }

        // Carrega os chamados do banco de dados e desenha na tela
        escutarDemandas((chamados) => {
            const listaDiv = document.getElementById("lista-chamados");
            listaDiv.innerHTML = ""; // Limpa a tela antes de desenhar

            if (chamados.length === 0) {
                listaDiv.innerHTML = "<p style='color: #8695A7; text-align: center; padding: 20px;'>Nenhum chamado aberto no momento.</p>";
                return;
            }

            chamados.forEach(chamado => {
                const div = document.createElement("div");
                div.className = "chamado-card";
                
                // O BOTÃO DE ABRIR CHAT QUE PASSA O ID AUTOMATICAMENTE
                const btnChat = `<a href="chat.html?id=${chamado.id}" class="btn-chat"><i class="fas fa-comments"></i> Abrir Chat</a>`;

                div.innerHTML = `
                    <div class="ticket-header">
                        <span style="font-weight: bold; color: #8695A7;">#${chamado.ticketId}</span>
                        <span class="badge status-${chamado.status}">${LABEL_STATUS[chamado.status]}</span>
                    </div>
                    <h3 style="margin: 5px 0 10px 0;">${chamado.titulo}</h3>
                    <p style="color: #A0AAB5; font-size: 0.9rem; margin-bottom: 15px;">${chamado.descricao}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 15px;">
                        <span style="font-size: 0.85rem; color: #8695A7;"><i class="fas fa-tag"></i> ${LABEL_CATEGORIA[chamado.categoria]}</span>
                        ${btnChat}
                    </div>
                `;
                listaDiv.appendChild(div);
            });
        });
    });

    // Função ativada quando o cliente clica em "Publicar chamado"
    const formChamado = document.getElementById("form-chamado");
    if(formChamado) {
        formChamado.addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            btn.textContent = "Publicando...";
            btn.disabled = true;

            const dados = {
                titulo: document.getElementById("titulo").value,
                descricao: document.getElementById("descricao").value,
                categoria: document.getElementById("categoria").value,
                clienteId: meuId,
                clienteNome: meuPerfil.nome
            };

            try {
                await criarDemanda(dados);
                e.target.reset(); // Limpa os campos depois de salvar
            } catch (error) {
                alert("Erro ao publicar: " + error.message);
            } finally {
                btn.textContent = "Publicar chamado";
                btn.disabled = false;
            }
        });
    }
</script>
</body>
</html>
